status = error

# Override on the command line, e.g. -Dblox.log.level=debug
rootLogger.level = ${sys:blox.log.level:-warn}
rootLogger.appenderRef.stdout.ref = stdout

# Runner/Validator always report per-level progress and duration at INFO,
# regardless of the root level, so `-Dblox.log.level=warn` can still silence
# the solver's own internal chatter without hiding the per-level report.
logger.runner.name = blox.Runner
logger.runner.level = info
logger.runner.additivity = false
logger.runner.appenderRef.stdout.ref = stdout

logger.validator.name = blox.Validator
logger.validator.level = info
logger.validator.additivity = false
logger.validator.appenderRef.stdout.ref = stdout

appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %5p [%t] (%F:%L) - %m%n
